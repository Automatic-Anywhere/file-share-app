<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Share App</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
        body { background: #f0f2f5; min-height:100vh; display:flex; justify-content:center; padding:20px 15px; }
        .container { background:white; border-radius:16px; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,.1); width:100%; max-width:800px; }
        h1 { color:#333; text-align:center; margin-bottom:20px; font-size:22px; }
        
        /* TABS */
        .tabs { display:flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab-btn { flex:1; padding:12px; text-align:center; font-weight:bold; color:#777; cursor:pointer; border:none; background:none; transition:all 0.3s; font-size:14px; }
        .tab-btn.active { color:#2196F3; border-bottom: 3px solid #2196F3; margin-bottom: -2px; }
        .tab-content { display:none; }
        .tab-content.active { display:block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        button { padding:10px 15px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:6px; }
        .btn-primary { background:#4CAF50; color:white; width:100%; padding:12px; font-size:15px; }
        .btn-secondary { background:#2196F3; color:white; }
        .input-box { width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; font-size:14px; margin-bottom:10px; outline:none; }
        
        /* TAB FILE */
        .file-item { display:flex; align-items:center; justify-content:space-between; padding:12px; background:#f9f9f9; border-radius:8px; margin-bottom:10px; border-left:4px solid #2196F3; }
        .file-info { display:flex; flex-direction:column; flex:1; }
        .file-name { font-weight:bold; font-size:14px; color:#333; word-break:break-all; }
        .file-size { font-size:12px; color:#888; }
        .file-actions a { font-size:20px; text-decoration:none; cursor:pointer; }
        .upload-input { display:none; }

        /* TAB TEXT */
        .note-item { display:flex; align-items:center; gap:8px; margin-bottom:12px; background:#fff; padding:10px; border-radius:8px; border: 2px solid #eee; transition: border-color 0.3s; }
        .note-item.editing { border-color: #f44336; }
        .note-item.saved { border-color: #4CAF50; }
        .note-text { flex: 1; padding: 5px; font-size: 14px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border: none; background: transparent; }
        .note-actions { display:flex; gap:5px; flex-shrink: 0; }
        .btn-icon { padding:8px; border-radius:6px; background:#f0f0f0; border:none; cursor:pointer; font-size:16px; }
        .btn-edit { color:#ff9800; }
        .btn-copy { color:#2196F3; }
        .btn-del { color:#f44336; }

        /* POPUP EDIT */
        #editModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:center; padding:20px; }
        .modal-content { background:white; width:100%; max-width:600px; padding:20px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.3); display:flex; flex-direction:column; gap:15px; }
        .modal-content textarea { width:100%; height:250px; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:15px; font-family:inherit; resize:none; }
        .modal-actions { display:flex; justify-content:flex-end; gap:10px; }
        .btn-cancel { background:#9e9e9e; color:white; }
        .btn-save { background:#4CAF50; color:white; }

        /* TAB SHARE */
        .url-box { display:flex; gap:10px; margin-bottom:15px; }
        .qr-container { display:flex; justify-content:center; margin:20px 0; }
        .apk-box { background:#fff3e0; padding:20px; border-radius:12px; text-align:center; border:2px dashed #ff9800; margin-top:20px; }
        .btn-apk { background:#ff9800; color:white; text-decoration:none; padding:10px 20px; border-radius:8px; display:inline-block; margin-top:10px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 File Share App</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('tab-file')">📤 File</button>
            <button class="tab-btn" onclick="openTab('tab-text')">📝 Văn bản</button>
            <button class="tab-btn" onclick="openTab('tab-share')">🔗 Chia sẻ</button>
        </div>

        <div id="tab-file" class="tab-content active">
            <button class="btn-primary" onclick="document.getElementById('fileInput').click()">📤 Tải File Lên</button>
            <input type="file" id="fileInput" class="upload-input" multiple>
            <div style="margin-top:20px;" id="filesContainer"></div>
        </div>

        <div id="tab-text" class="tab-content">
            <button class="btn-primary" style="background:#ff9800; margin-bottom:15px;" onclick="addNewNote()">+ Tạo Văn Bản Mới</button>
            <div id="notesContainer"></div>
        </div>

        <div id="tab-share" class="tab-content">
            <p style="margin-bottom:10px; font-size:14px; color:#555;">Đường dẫn truy cập:</p>
            <div class="url-box">
                <input type="text" id="shareUrl" class="input-box" readonly>
                <button class="btn-secondary" onclick="copyLink()">Copy</button>
            </div>
            <div class="qr-container"><div id="qrcode"></div></div>
            <div class="apk-box">
                <h3 style="color:#e65100; margin-bottom:5px;">📱 Tải App cho máy khác</h3>
                <a href="/download-apk" class="btn-apk">⬇️ Tải File APK</a>
            </div>
        </div>
    </div>

    <!-- POPUP CHỈNH SỬA -->
    <div id="editModal">
        <div class="modal-content">
            <h3 style="color:#333;">Chỉnh sửa văn bản</h3>
            <textarea id="modalTextarea"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Hủy</button>
                <button class="btn-save" onclick="saveModal()">💾 Lưu</button>
            </div>
        </div>
    </div>

    <script>
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // ==================== FILE ====================
        document.getElementById('fileInput').addEventListener('change', async function (e) {
            const files = e.target.files;
            if (!files.length) return;
            const form = new FormData();
            for (const f of files) form.append('files', f);
            try { await fetch('/api/upload', { method: 'POST', body: form }); await loadFileList(); } catch (err) {}
            e.target.value = '';
        });

        async function loadFileList() {
            const container = document.getElementById('filesContainer');
            try {
                const res = await fetch('/api/files');
                const data = await res.json();
                if (data.files.length === 0) { container.innerHTML = '<p style="text-align:center;color:#999;">Chưa có file.</p>'; return; }
                container.innerHTML = data.files.map(f => `
                    <div class="file-item">
                        <div class="file-info">
                            <span class="file-name">📎 ${f.name}</span>
                            <span class="file-size">${(f.size/1024).toFixed(1)} KB</span>
                        </div>
                        <div class="file-actions"><a href="${f.url}" download="${f.name}">⬇️</a></div>
                    </div>
                `).join('');
            } catch (err) {}
        }

        // ==================== NOTES & SYNC ====================
        let notesList = [];
        let currentEditIndex = -1;
        let isTyping = false; // Cờ đánh dấu xem người dùng đang gõ hay không

        async function fetchNotesFromServer(isAutoRefresh = false) {
            // Nếu đang mở popup (đang gõ) thì không làm mới để tránh mất chữ
            if (isAutoRefresh && (currentEditIndex !== -1 || isTyping)) return;

            try {
                const res = await fetch('/api/text');
                const data = await res.json();
                const newData = Array.isArray(data) ? data : [];

                // So sánh dữ liệu mới với dữ liệu cũ. Nếu khác thì mới vẽ lại
                if (JSON.stringify(newData) !== JSON.stringify(notesList)) {
                    notesList = newData;
                    renderNotes();
                }
            } catch (err) {}
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            if (notesList.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;font-style:italic;">Chưa có văn bản nào. Bấm "Tạo mới" để thêm!</p>';
                return;
            }
            container.innerHTML = notesList.map((note, index) => {
                let stateClass = (index === currentEditIndex) ? "editing" : "";
                return `
                <div class="note-item ${stateClass}" id="note-item-${index}" onclick="highlightNote(${index})">
                    <div class="note-text" onclick="openModal(${index})">${note || '<i style="color:#aaa;">(Trống)</i>'}</div>
                    <div class="note-actions">
                        <button class="btn-icon btn-edit" onclick="event.stopPropagation(); openModal(${index})" title="Chỉnh sửa">✏️</button>
                        <button class="btn-icon btn-copy" onclick="event.stopPropagation(); copyNote(${index})" title="Sao chép">📋</button>
                        <button class="btn-icon btn-del" onclick="event.stopPropagation(); deleteNote(${index})" title="Xóa">🗑️</button>
                    </div>
                </div>
            `}).join('');
        }

        function highlightNote(index) {
            document.querySelectorAll('.note-item').forEach(el => el.classList.remove('editing', 'saved'));
        }

        async function addNewNote() {
            notesList.push("");
            await syncNotesToServer();
            currentEditIndex = notesList.length - 1;
            renderNotes();
            openModal(currentEditIndex); // Mở luôn popup cho tiện
        }

        async function deleteNote(index) {
            if(!confirm("Xóa văn bản này?")) return;
            notesList.splice(index, 1);
            if(currentEditIndex === index) currentEditIndex = -1;
            await syncNotesToServer();
            renderNotes();
        }

        function copyNote(index) {
            navigator.clipboard.writeText(notesList[index]).then(() => alert('Đã sao chép văn bản!'));
        }

        async function syncNotesToServer() {
            try {
                await fetch('/api/text/save', {
                    method: 'POST',
                    body: JSON.stringify(notesList)
                });
            } catch (err) {}
        }

        // --- POPUP MODAL LOGIC ---
        function openModal(index) {
            currentEditIndex = index;
            document.getElementById('modalTextarea').value = notesList[index] || "";
            document.getElementById('editModal').style.display = 'flex';
            
            // Lắng nghe sự kiện gõ phím để bật cờ isTyping
            document.getElementById('modalTextarea').addEventListener('input', () => {
                isTyping = true;
            });
            
            renderNotes(); // Cập nhật màu đỏ
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditIndex = -1;
            isTyping = false;
            renderNotes(); // Trở về màu bình thường
        }

        async function saveModal() {
            const text = document.getElementById('modalTextarea').value;
            notesList[currentEditIndex] = text;
            
            document.getElementById('editModal').style.display = 'none';
            
            const savedIndex = currentEditIndex;
            currentEditIndex = -1;
            isTyping = false;
            
            renderNotes();
            
            const savedItem = document.getElementById('note-item-' + savedIndex);
            if (savedItem) {
                savedItem.classList.add('saved'); // Màu xanh
                setTimeout(() => savedItem.classList.remove('saved'), 1500);
            }

            await syncNotesToServer(); // Lưu lên server ngay lập tức
        }

        // ==================== SHARE ====================
        async function loadShareInfo() {
            try {
                const res = await fetch('/api/my-ip');
                const data = await res.json();
                const url = `http://${data.ip}:8000`;
                document.getElementById('shareUrl').value = url;
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById('qrcode'), { text: url, width: 180, height: 180 });
            } catch (_) {}
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('shareUrl').value).then(() => alert('Đã copy link!'));
        }

        // Khởi tạo
        window.addEventListener('DOMContentLoaded', () => {
            loadFileList();
            fetchNotesFromServer(); // Tải lần đầu
            loadShareInfo();
            
            // Tự động đồng bộ mỗi 3 giây
            setInterval(loadFileList, 5000);
            setInterval(() => fetchNotesFromServer(true), 3000);
        });
    </script>
</body>
</html>
