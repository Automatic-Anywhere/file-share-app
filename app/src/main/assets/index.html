<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Share App</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; display:flex; justify-content:center; padding:20px 15px; }
        .container { background:white; border-radius:20px; padding:25px; box-shadow:0 20px 60px rgba(0,0,0,.3); width:100%; max-width:1100px; }
        h1 { color:#333; text-align:center; margin-bottom:25px; font-size:24px; }
        .layout { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
        @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } }
        .col { display:flex; flex-direction:column; gap:15px; }
        .panel { background:#fafafa; border-radius:14px; padding:20px; border:1px solid #eee; }
        .panel h2 { color:#333; font-size:16px; margin-bottom:15px; display:flex; align-items:center; gap:8px; }
        .buttons { display:flex; gap:12px; flex-wrap:wrap; }
        button { padding:13px 22px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; transition:all .3s; display:flex; align-items:center; gap:8px; justify-content:center; }
        .btn-upload { background:#4CAF50; color:white; flex:1; }
        .btn-refresh { background:#607d8b; color:white; flex:0 0 auto; }
        .link-box { display:block; }
        .link-box p { color:#666; font-size:13px; margin-bottom:10px; }
        .link-box .url { background:white; padding:12px; border-radius:8px; font-family:'Courier New', monospace; color:#2196F3; font-weight:600; word-break:break-all; border:1px solid #ddd; display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
        .copy-btn { background:#2196F3; color:white; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:12px; }
        .qr-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; padding:18px; background:white; border-radius:12px; border:2px dashed #ff9800; }
        .file-item { display:flex; align-items:center; justify-content:space-between; padding:12px 15px; background:white; border-radius:8px; margin-bottom:10px; border-left:4px solid #2196F3; gap:8px; }
        .file-info { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
        .file-icon { font-size:24px; }
        .file-details { min-width:0; flex:1; }
        .file-name { color:#333; font-weight:500; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .file-size { color:#999; font-size:12px; margin-top:2px; }
        .file-actions { display:flex; gap:4px; }
        .download-link, .delete-btn { color:#2196F3; text-decoration:none; font-size:20px; padding:8px; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; }
        .delete-btn { color:#f44336; }
        .empty-message { text-align:center; color:#999; padding:25px; font-style:italic; font-size:14px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#333; color:white; padding:12px 24px; border-radius:8px; opacity:0; transition:all .3s; z-index:1000; }
        .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
        .upload-input { display:none; }
        
        /* CSS CHO NÚT TẢI APK */
        .apk-box {
            background: #fff3e0; border: 2px dashed #ff9800;
            border-radius: 12px; padding: 20px; text-align: center;
            margin-top: 15px;
        }
        .apk-box h3 { color: #e65100; font-size: 16px; margin-bottom: 8px; }
        .apk-box p { color: #bf360c; font-size: 13px; margin-bottom: 15px; }
        .btn-apk {
            background: #ff9800; color: white; text-decoration: none;
            padding: 12px 20px; border-radius: 8px; font-weight: bold;
            display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
        }
        .btn-apk:hover { background: #f57c00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 File Share App</h1>
        <div class="layout">
            <div class="col">
                <div class="panel">
                    <h2>📤 Upload & Download</h2>
                    <div class="buttons">
                        <button class="btn-upload" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
                            <span>📤</span> Upload Files
                        </button>
                        <button class="btn-refresh" onclick="loadFileList()">🔄</button>
                    </div>
                    <input type="file" id="fileInput" class="upload-input" multiple>
                </div>
                <div class="panel">
                    <h2>📋 File đang share</h2>
                    <div id="filesContainer"></div>
                </div>
            </div>
            <div class="col">
                <div class="panel">
                    <h2>🔗 Share Link</h2>
                    <div class="link-box">
                        <p>Đường dẫn truy cập từ máy khác:</p>
                        <div class="url">
                            <span id="shareUrl">Đang lấy IP...</span>
                            <button class="copy-btn" onclick="copyLink()">Copy</button>
                        </div>
                        <div class="qr-wrap">
                            <div id="qrcode"></div>
                            <div style="font-size:12px; color:#888;">📱 Quét QR bằng máy khác để mở</div>
                        </div>
                    </div>
                </div>

                <!-- KHỐI TẢI APK MỚI -->
                <div class="panel apk-box">
                    <h3>📱 Tải App về máy</h3>
                    <p>Cài đặt App này trên điện thoại khác để nhận file dễ dàng hơn.</p>
                    <a href="/download-apk" class="btn-apk">
                        ⬇️ Tải File APK
                    </a>
                </div>

            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async function (e) {
            const files = e.target.files;
            if (!files.length) return;
            const form = new FormData();
            for (const f of files) form.append('files', f);
            showToast(`Đang upload ${files.length} file...`);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: form });
                const data = await res.json();
                if(data.ok) { showToast(`✅ Đã upload ${data.saved.length} file`); await loadFileList(); }
                else showToast('❌ ' + (data.error || 'Lỗi'));
            } catch (err) { showToast('❌ Upload lỗi!'); }
            e.target.value = '';
        });

        async function loadFileList() {
            const container = document.getElementById('filesContainer');
            try {
                const res = await fetch('/api/files');
                const data = await res.json();
                if (data.files.length === 0) {
                    container.innerHTML = '<p class="empty-message">Chưa có file nào!</p>';
                    return;
                }
                container.innerHTML = data.files.map(file => `
                    <div class="file-item">
                        <div class="file-info">
                            <span class="file-icon">📎</span>
                            <div class="file-details">
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${(file.size/1024).toFixed(1)} KB</div>
                            </div>
                        </div>
                        <div class="file-actions">
                            <a href="${file.url}" download="${file.name}" class="download-link">⬇️</a>
                            <button class="delete-btn" onclick="removeFile('${file.name}')">🗑️</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) { container.innerHTML = '<p class="empty-message">Lỗi tải dữ liệu</p>'; }
        }

        async function removeFile(name) {
            if (!confirm(`Xoá file "${name}"?`)) return;
            await fetch('/api/remove-file', { method: 'POST', body: JSON.stringify({ name }) });
            await loadFileList();
        }

        async function loadShareInfo() {
            const urlEl = document.getElementById('shareUrl');
            try {
                const res = await fetch('/api/my-ip');
                const data = await res.json();
                const url = `http://${data.ip}:8000`;
                urlEl.textContent = url;
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById('qrcode'), {
                    text: url, width: 180, height: 180,
                    colorDark: '#000000', colorLight: '#ffffff'
                });
            } catch (_) { urlEl.textContent = 'Lỗi lấy IP'; }
        }

        function copyLink() {
            const url = document.getElementById('shareUrl').textContent;
            navigator.clipboard.writeText(url).then(() => showToast('📋 Đã copy link!'));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFileList();
            loadShareInfo();
            setInterval(loadFileList, 5000);
        });
    </script>
</body>
</html>
